:root {
  --fond: #f0f4f9;          /* colonne et barre du haut */
  --panneau: #e7edf6;       /* grand panneau de contenu */
  --carte: #ffffff;
  --bleu: #1f368b;          /* bleu LCL */
  --nuit: #0f1b4d;
  --vif: #2f50d0;           /* boutons */
  --vif-fonce: #2441b3;
  --clair: #d7e1ff;         /* pilule active, conteneur secondaire */
  --pale: #edf1ff;
  --jaune: #ffd204;
  --jaune-pale: #fff6c7;
  --encre: #1b1f2a;
  --encre-2: #454b5b;
  --gris: #6b7285;
  --contour: #747a8a;
  --filet: #d5dbe7;
  --ok: #17794b; --ok-pale: #ddf3e7;
  --att: #9a5b00; --att-pale: #fff0d3;
  --ko: #b8322a; --ko-pale: #fde4e1;
  --t1: #3e61e1; --t2: #0f8a7e; --t3: #c2410c; --t4: #7c3aed; --t5: #0369a1; --t6: #b45309;
  --ombre: 0 1px 2px rgba(15, 27, 77, .06), 0 2px 8px rgba(15, 27, 77, .06);
  --ombre-haute: 0 4px 12px rgba(15, 27, 77, .10), 0 12px 32px rgba(15, 27, 77, .10);
  --r-carte: 28px;
  --titre: #0f1b4d;          /* les titres et les textes forts */
  --survol: #e3e9f3; --neutre: #eef0f4; --piste: #e6eaf2; --barre-f: #b9c9ff;
  --police: "Google Sans Flex", "Google Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--police); color: var(--encre); background: var(--fond); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; font-optical-sizing: auto; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
.ic { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1;
  letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr;
  font-feature-settings: "liga"; -webkit-font-feature-settings: "liga"; font-variation-settings: "FILL" 0, "wght" 400, "opsz" 24; user-select: none; flex: none; }
.ic.plein { font-variation-settings: "FILL" 1, "wght" 400, "opsz" 24; }
.ic.s18 { font-size: 18px; } .ic.s20 { font-size: 20px; } .ic.s28 { font-size: 28px; } .ic.s32 { font-size: 32px; } .ic.s40 { font-size: 40px; }

/* ---------- Charpente ---------- */
.appli { display: grid; grid-template-columns: 248px 1fr; grid-template-rows: 68px 1fr; height: 100vh; }
.haut { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 24px 0 20px; }
.marque { display: flex; align-items: center; gap: 12px; width: 212px; flex: none; }
.marque img { height: 30px; display: block; }
.marque .nom { font-size: 21px; font-weight: 500; letter-spacing: -.01em; color: var(--encre); }
.marque .sig { font-size: 12px; color: var(--gris); display: block; margin-top: -3px; }
.haut .espace { flex: 1; }
.demander-haut { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px 0 16px; min-width: 380px;
  border-radius: 999px; background: var(--carte); color: var(--encre-2); box-shadow: var(--ombre); transition: box-shadow .2s; }
.demander-haut:hover { box-shadow: var(--ombre-haute); }
.demander-haut .t { flex: 1; text-align: left; }
.touche { font-size: 12px; border: 1px solid var(--filet); border-radius: 6px; padding: 1px 6px; color: var(--gris); }
.compte-btn { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 4px; border-radius: 999px; }
.compte-btn:hover { background: var(--survol); }
.compte-btn .qui { text-align: left; line-height: 1.2; }
.compte-btn .qui b { font-weight: 500; display: block; font-size: 14px; }
.compte-btn .qui span { font-size: 12px; color: var(--gris); }

.rail { display: flex; flex-direction: column; padding: 8px 12px 16px; gap: 2px; overflow-y: auto; }
.rail .groupe { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--gris); padding: 12px 16px 4px; }
.rail a { display: flex; align-items: center; gap: 14px; height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14.5px; font-weight: 500; color: var(--encre-2); transition: background .15s; }
.rail a:hover { background: var(--survol); }
.rail a.actif { background: var(--clair); color: var(--titre); }
.rail a.actif .ic { font-variation-settings: "FILL" 1, "wght" 400, "opsz" 24; color: var(--bleu); }
.rail .bas { margin-top: auto; padding-top: 12px; }
.rail .rail-bas { margin-top: auto; padding-top: 16px; }
.rail .rail-bas a { font-size: 13.5px; color: var(--gris); }
.rail .compteur { margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--jaune); color: var(--nuit); font-size: 12px; font-weight: 600; display: grid; place-items: center; }

.panneau { background: var(--panneau); border-top-left-radius: 48px; overflow-y: auto; overflow-x: hidden; position: relative; scroll-behavior: smooth; }
.page { max-width: 1240px; margin: 0 auto; padding: 36px 48px 72px; animation: entree .35s ease both; }
@keyframes entree { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.pied { max-width: 1240px; margin: 0 auto; padding: 0 48px 32px; font-size: 12.5px; color: var(--gris); display: flex; gap: 16px; }

/* ---------- En-têtes de page ---------- */
.onglets { display: flex; justify-content: center; margin: 4px 0 28px; }
.onglets .groupe-o { display: inline-flex; gap: 4px; padding: 6px; border-radius: 999px; background: var(--carte); box-shadow: var(--ombre-haute); }
.onglets a { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 999px; font-weight: 500; font-size: 15px; color: var(--encre-2); }
.onglets a:hover { background: var(--pale); }
.onglets a.actif { background: var(--clair); color: var(--titre); }
.onglets a.actif .ic { color: var(--bleu); font-variation-settings: "FILL" 1, "wght" 400, "opsz" 24; }
.tete { text-align: center; max-width: 760px; margin: 0 auto 24px; }
.tete h1 { font-size: 36px; line-height: 1.2; font-weight: 500; letter-spacing: -.015em; }
.tete p { margin-top: 10px; color: var(--encre-2); font-size: 16px; }
.tete .kicker { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 13px; font-weight: 500; color: var(--bleu);
  background: var(--carte); border-radius: 999px; padding: 6px 14px 6px 10px; box-shadow: var(--ombre); }
.fil { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--gris); margin-bottom: 18px; }
.fil a { color: var(--vif); font-weight: 500; }
.fil a:hover { text-decoration: underline; }
.recherche { display: flex; align-items: center; gap: 12px; max-width: 720px; margin: 0 auto 16px; height: 56px; padding: 0 20px;
  border-radius: 999px; border: 1px solid var(--contour); background: transparent; transition: background .2s, border-color .2s; }
.recherche:focus-within { background: var(--carte); border-color: var(--vif); }
.recherche input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 16px; }
.puces { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0 auto 32px; max-width: 980px; }
.puce { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--contour);
  font-size: 14px; font-weight: 500; color: var(--encre-2); background: transparent; transition: background .15s; }
.puce:hover { background: rgba(47, 80, 208, .06); }
.puce.actif { background: var(--clair); border-color: var(--clair); color: var(--titre); padding-left: 10px; }
.puce .n { font-size: 12px; color: var(--gris); }

/* ---------- Sections ---------- */
.section { margin-top: 40px; }
.section-t { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.section-t h2 { font-size: 22px; font-weight: 500; letter-spacing: -.01em; }
.section-t .lien { font-size: 14px; font-weight: 500; color: var(--vif); display: inline-flex; align-items: center; gap: 4px; }
.section-t .lien:hover { text-decoration: underline; }
.section-t p { color: var(--gris); font-size: 14px; }
.grille { display: grid; gap: 20px; }
.grille > * { min-width: 0; } /* une étiquette longue ne pousse plus la grille hors du panneau */
.g2 { grid-template-columns: repeat(2, 1fr); } .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); }
.g-2-1 { grid-template-columns: 2fr 1fr; } .g-1-2 { grid-template-columns: 1fr 2fr; }

/* ---------- Cartes ---------- */
.carte { background: var(--carte); border-radius: var(--r-carte); padding: 24px; position: relative; display: flex; flex-direction: column; gap: 10px;
  transition: box-shadow .2s, transform .2s; }
a.carte:hover, .carte.cliquable:hover { box-shadow: var(--ombre-haute); transform: translateY(-2px); }
.carte h3 { font-size: 18px; font-weight: 500; line-height: 1.3; letter-spacing: -.005em; }
.carte .desc { color: var(--encre-2); font-size: 14.5px; }
.carte .meta { color: var(--gris); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.carte .meta span { display: inline-flex; align-items: center; gap: 4px; }
.carte .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 8px; }
.carte .haut-c { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pastille { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: var(--pale); color: var(--bleu); flex: none; }
.pastille.ronde { border-radius: 50%; }
.pastille.jaune { background: var(--jaune-pale); color: var(--titre); }
.pastille.petite { width: 40px; height: 40px; border-radius: 12px; }
.carte.plate { box-shadow: none; }
.carte.tonal { background: var(--pale); }
.carte.nuit { background: var(--nuit); color: #fff; }
.carte.nuit .desc { color: #c9d3f3; }

/* ---------- Boutons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 22px; border-radius: 999px; font-size: 14px; font-weight: 500;
  background: var(--vif); color: #fff; transition: background .15s, box-shadow .15s; white-space: nowrap; }
.btn:hover { background: var(--vif-fonce); box-shadow: var(--ombre); }
.btn.contour { background: transparent; color: var(--vif); border: 1px solid var(--contour); }
.btn.contour:hover { background: rgba(47, 80, 208, .06); box-shadow: none; }
.btn.tonal { background: var(--clair); color: var(--titre); }
.btn.tonal:hover { background: #c8d5ff; }
.btn.texte { background: transparent; color: var(--vif); padding: 0 12px; }
.btn.texte:hover { background: rgba(47, 80, 208, .06); box-shadow: none; }
.btn.jaune { background: var(--jaune); color: var(--nuit); }
.btn.jaune:hover { background: #f5c800; }
.btn.grand { height: 48px; padding: 0 28px; font-size: 15px; }
.btn .ic { font-size: 20px; }
.btn.fait { background: var(--ok-pale); color: var(--ok); }

/* ---------- Étiquettes ---------- */
.etiq { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: 8px; font-size: 12.5px; font-weight: 500; background: var(--pale); color: var(--bleu); white-space: nowrap; }
.etiq .ic { font-size: 16px; }
.etiq.officiel { background: var(--bleu); color: #fff; }
.etiq.verifie { background: var(--clair); color: var(--titre); }
.etiq.declare { background: var(--neutre); color: var(--encre-2); }
.etiq.personnel { background: transparent; color: var(--gris); border: 1px dashed var(--contour); }
.etiq.ok { background: var(--ok-pale); color: var(--ok); }
.etiq.att { background: var(--att-pale); color: var(--att); }
.etiq.ko { background: var(--ko-pale); color: var(--ko); }
.etiq.jaune { background: var(--jaune-pale); color: var(--titre); }
.etiq.neutre { background: var(--neutre); color: var(--encre-2); }
.point { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--gris); flex: none; }
.point.ok { background: var(--ok); } .point.att { background: #d98a00; } .point.ko { background: var(--ko); }

/* ---------- Avatars ---------- */
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 14px; flex: none; letter-spacing: .02em; }
.avatar.t1 { background: var(--t1); } .avatar.t2 { background: var(--t2); } .avatar.t3 { background: var(--t3); }
.avatar.t4 { background: var(--t4); } .avatar.t5 { background: var(--t5); } .avatar.t6 { background: var(--t6); }
.avatar.grand { width: 112px; height: 112px; font-size: 36px; box-shadow: 0 0 0 5px var(--carte), 0 0 0 9px var(--clair); margin: 6px auto 8px; }
.avatar.moyen { width: 64px; height: 64px; font-size: 22px; }
.avatar.petit { width: 28px; height: 28px; font-size: 11px; }

/* ---------- Accueil « Pour vous » ---------- */
.hero { position: relative; text-align: center; padding: 28px 0 8px; }
.hero h1 { font-size: 60px; line-height: 1.05; font-weight: 500; letter-spacing: -.03em; }
.hero h1 .main { background: linear-gradient(90deg, var(--bleu), var(--vif) 60%, #5b7cf0); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .sous { margin-top: 14px; font-size: 17px; color: var(--encre-2); }
.hero .sous b { font-weight: 500; color: var(--encre); }
.hero .constellation { position: absolute; inset: -20px 0 auto; width: 100%; height: 300px; z-index: 0; pointer-events: none;
  -webkit-mask-image: radial-gradient(ellipse 38% 80% at 50% 45%, transparent 55%, #000 85%); mask-image: radial-gradient(ellipse 38% 80% at 50% 45%, transparent 55%, #000 85%); }
.hero > *:not(.constellation) { position: relative; z-index: 1; }
.demander-grand { display: flex; align-items: center; gap: 14px; width: 100%; max-width: 760px; margin: 28px auto 14px; height: 64px; padding: 0 12px 0 24px;
  background: var(--carte); border-radius: 999px; box-shadow: var(--ombre-haute); color: var(--gris); font-size: 17px; text-align: left; transition: box-shadow .2s, transform .2s; }
.demander-grand:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(15, 27, 77, .14), 0 16px 40px rgba(15, 27, 77, .10); }
.demander-grand .t { flex: 1; }
.demander-grand .go { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--vif); color: #fff; }
.essayez { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; align-items: center; }
.essayez .lab { font-size: 13px; color: var(--gris); margin-right: 4px; }
.essayez .puce { background: var(--carte); border-color: transparent; box-shadow: var(--ombre); font-weight: 400; }
.essayez .puce:hover { background: var(--pale); }
.afaire { display: flex; flex-direction: row; align-items: center; gap: 16px; padding: 18px 22px; }
.afaire .txt { flex: 1; }
.afaire b { font-weight: 500; display: block; font-size: 15.5px; }
.afaire span { color: var(--encre-2); font-size: 14px; }
.progression { height: 8px; border-radius: 4px; background: var(--piste); overflow: hidden; }
.progression i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--vif), #6f8cff); }
.progression.jaune i { background: var(--jaune); }

/* ---------- Date d'événement ---------- */
.date-ev { width: 64px; flex: none; border-radius: 18px; background: var(--pale); color: var(--bleu); text-align: center; padding: 8px 0 7px; }
.date-ev b { display: block; font-size: 26px; font-weight: 500; line-height: 1; }
.date-ev span { font-size: 12.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
.ev { flex-direction: row; gap: 18px; align-items: flex-start; }
.ev .corps { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }

/* ---------- Illustrations ---------- */
.art { border-radius: 20px; overflow: hidden; display: block; width: 100%; background: var(--pale); }
.art svg { display: block; width: 100%; height: 100%; }
.une { display: grid; grid-template-columns: 1.1fr 1fr; gap: 0; padding: 0; overflow: hidden; }
.une .art { border-radius: 0; height: 100%; min-height: 300px; }
.une .corps { padding: 36px; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.une h2 { font-size: 32px; font-weight: 500; line-height: 1.15; letter-spacing: -.02em; }

/* ---------- Fiches ---------- */
.fiche-tete { display: flex; gap: 24px; align-items: flex-start; background: var(--carte); border-radius: 32px; padding: 32px; }
.fiche-tete .pastille { width: 72px; height: 72px; border-radius: 22px; }
.fiche-tete .pastille .ic { font-size: 36px; }
.fiche-tete .corps { flex: 1; display: flex; flex-direction: column; gap: 12px; }
.fiche-tete h1 { font-size: 32px; font-weight: 500; line-height: 1.15; letter-spacing: -.02em; }
.fiche-tete .ligne { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bandeau { display: flex; gap: 14px; align-items: flex-start; border-radius: 20px; padding: 16px 20px; margin-top: 16px; }
.bandeau.ko { background: var(--ko-pale); color: #6e1b15; }
.bandeau.att { background: var(--att-pale); color: #5a3500; }
.bandeau.ok { background: var(--ok-pale); color: #0c4a2d; }
.bandeau.info { background: var(--jaune-pale); color: var(--titre); }
.bandeau b { font-weight: 600; }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 20px; font-size: 14.5px; }
.dl dt { color: var(--gris); }
.dl dd { margin: 0; font-weight: 500; }
.gros-chiffre { font-size: 44px; font-weight: 500; line-height: 1; letter-spacing: -.02em; color: var(--titre); }
.gros-chiffre small { font-size: 18px; color: var(--gris); font-weight: 400; }
.classes { display: flex; gap: 6px; }
.classes span { flex: 1; text-align: center; font-size: 12.5px; font-weight: 600; padding: 8px 0; border-radius: 10px; background: var(--neutre); color: var(--gris); }
.classes span.on { background: var(--clair); color: var(--titre); }
.classes span.non { background: var(--ko-pale); color: var(--ko); }

/* ---------- Tableau ---------- */
.tableau { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14.5px; }
.tableau th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--gris); padding: 10px 14px; letter-spacing: .02em; }
.tableau td { padding: 14px; border-top: 1px solid var(--filet); vertical-align: middle; }
.tableau td.c, .tableau th.c { text-align: center; }
.verd { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; }
.verd.o { background: var(--ok-pale); color: var(--ok); } .verd.a { background: var(--att-pale); color: var(--att); } .verd.n { background: var(--ko-pale); color: var(--ko); }

/* ---------- Pilotage ---------- */
.nord { display: grid; grid-template-columns: 1.1fr 1fr; gap: 0; padding: 0; overflow: hidden; }
.nord .g { padding: 36px; background: var(--nuit); color: #fff; position: relative; overflow: hidden; }
.nord .g .chiffre { font-size: 88px; font-weight: 500; line-height: 1; letter-spacing: -.04em; margin: 14px 0 10px; }
.nord .g p { color: #c9d3f3; font-size: 16px; max-width: 380px; }
.nord .d { padding: 28px 32px; display: flex; flex-direction: column; justify-content: center; }
.nord .ligne-i { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-top: 1px solid var(--filet); }
.nord .ligne-i:first-child { border-top: 0; }
.nord .ligne-i b { font-size: 28px; font-weight: 500; min-width: 84px; color: var(--titre); letter-spacing: -.02em; }
.barre-h { display: grid; grid-template-columns: 180px 1fr 44px; align-items: center; gap: 12px; font-size: 14px; padding: 6px 0; }
.barre-h .progression { height: 12px; border-radius: 6px; }
.barre-h b { font-weight: 500; text-align: right; }
.pile { display: flex; height: 16px; border-radius: 8px; overflow: hidden; gap: 3px; }
.pile i { display: block; height: 100%; }

/* ---------- Étapes ---------- */
.etapes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; counter-reset: etape; }
.etape { background: var(--carte); border-radius: 24px; padding: 22px; position: relative; display: flex; flex-direction: column; gap: 8px; }
.etape .n { width: 32px; height: 32px; border-radius: 50%; background: var(--clair); color: var(--titre); font-weight: 600; display: grid; place-items: center; font-size: 14px; }
.etape.actif { box-shadow: 0 0 0 2px var(--vif); }
.etape.actif .n { background: var(--vif); color: #fff; }
.etape.fait .n { background: var(--ok); color: #fff; }
.etape b { font-weight: 500; font-size: 16px; }
.etape span { color: var(--encre-2); font-size: 14px; }

/* ---------- Questions (quiz, Good enough) ---------- */
.question { padding: 18px 0; border-top: 1px solid var(--filet); }
.question:first-child { border-top: 0; padding-top: 4px; }
.question .q { font-weight: 500; margin-bottom: 10px; }
.segments { display: inline-flex; border: 1px solid var(--contour); border-radius: 999px; overflow: hidden; }
.segments button { height: 38px; padding: 0 18px; font-size: 14px; font-weight: 500; color: var(--encre-2); border-left: 1px solid var(--contour); display: inline-flex; align-items: center; gap: 6px; }
.segments button:first-child { border-left: 0; }
.segments button:hover { background: rgba(47, 80, 208, .06); }
.segments button.actif { background: var(--clair); color: var(--titre); }
.verdict { border-radius: 24px; padding: 24px; display: flex; gap: 16px; align-items: flex-start; }
.verdict.ok { background: var(--ok-pale); } .verdict.att { background: var(--att-pale); } .verdict.info { background: var(--pale); }
.verdict h3 { font-size: 20px; font-weight: 500; }

/* ---------- Couche « Demander à Repère », menus, toasts ---------- */
.voile { position: fixed; inset: 0; background: rgba(15, 27, 77, .32); backdrop-filter: blur(2px); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding-top: 10vh; animation: fondu .2s ease both; }
@keyframes fondu { from { opacity: 0; } to { opacity: 1; } }
.dialogue { width: min(760px, 92vw); background: var(--carte); border-radius: 32px; box-shadow: 0 24px 64px rgba(15, 27, 77, .28); overflow: hidden; animation: monte .25s ease both; }
@keyframes monte { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
.dialogue .champ { display: flex; align-items: center; gap: 14px; padding: 0 24px; height: 68px; border-bottom: 1px solid var(--filet); }
.dialogue .champ input { flex: 1; border: 0; outline: 0; font-size: 18px; }
.dialogue .liste { max-height: 52vh; overflow-y: auto; padding: 10px; }
.dialogue .item { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 16px; width: 100%; text-align: left; font-size: 15px; }
.dialogue .item:hover, .dialogue .item.sel { background: var(--pale); }
.dialogue .item .ic { color: var(--gris); }
.dialogue .reponse { padding: 24px 28px 28px; }
.dialogue .reponse .q { font-size: 14px; color: var(--gris); display: flex; align-items: center; gap: 8px; }
.dialogue .reponse .r { font-size: 19px; line-height: 1.45; margin: 12px 0 18px; }
.dialogue .note { padding: 12px 24px; font-size: 12.5px; color: var(--gris); background: var(--fond); display: flex; gap: 8px; align-items: center; }
.lien-carte { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: var(--pale); }
.lien-carte:hover { background: var(--clair); }
.lien-carte b { font-weight: 500; display: block; }
.lien-carte span { font-size: 13px; color: var(--encre-2); }
.menu { position: fixed; z-index: 60; background: var(--carte); border-radius: 20px; box-shadow: var(--ombre-haute); padding: 8px; width: 320px; animation: monte .18s ease both; }
.menu .item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; width: 100%; text-align: left; }
.menu .item:hover { background: var(--pale); }
.menu .item.actif { background: var(--clair); }
.menu .item b { font-weight: 500; display: block; font-size: 14px; }
.menu .item span { font-size: 12.5px; color: var(--gris); }
.menu .titre { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--gris); padding: 8px 12px 6px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--nuit); color: #fff; padding: 14px 22px; border-radius: 16px; font-size: 14.5px; z-index: 80;
  display: flex; align-items: center; gap: 10px; box-shadow: var(--ombre-haute); animation: monte .25s ease both; }
.toast .ic { color: var(--jaune); }

/* ---------- Profil ---------- */
.profil-tete { position: relative; background: var(--carte); border-radius: 32px; overflow: hidden; text-align: center; padding-bottom: 28px; }
.profil-tete .ban { height: 140px; }
.profil-tete .avatar.grand { margin-top: -62px; position: relative; }
.profil-tete h1 { font-size: 30px; font-weight: 500; letter-spacing: -.02em; }
.badges { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
.badge { width: 128px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; }
.badge .disque { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--jaune), #ffb703); color: var(--nuit); box-shadow: 0 4px 12px rgba(255, 190, 0, .35); }
.badge .disque .ic { font-size: 34px; }
.badge.off { opacity: .45; }
.badge.off .disque { background: var(--piste); box-shadow: none; color: var(--gris); }
.badge b { font-weight: 500; }

/* ---------- Champions ---------- */
.champion { align-items: center; text-align: center; padding: 28px 22px 22px; }
.champion h3 { font-size: 20px; }
.champion .lieu { font-size: 13.5px; color: var(--encre-2); }
.champion .sp { font-size: 12px; color: var(--gris); margin-top: 6px; }
.champion .tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.champion .actions { justify-content: center; }
.missions { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.mission { background: rgba(255, 255, 255, .08); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.mission b { font-weight: 500; }
.mission span { font-size: 13.5px; color: #c9d3f3; }
.mission .ic { color: var(--jaune); align-self: flex-start; }

/* ---------- Visite guidée ---------- */
.visite-carte { position: fixed; left: 16px; bottom: 16px; width: 384px; z-index: 70; background: var(--carte); border-radius: 28px; box-shadow: 0 16px 48px rgba(15, 27, 77, .28);
  padding: 22px 24px 18px; animation: monte .3s ease both; }
.visite-carte .chap { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; letter-spacing: .04em; color: var(--bleu); text-transform: uppercase; }
.visite-carte .chap .n { margin-left: auto; font-weight: 500; color: var(--gris); letter-spacing: 0; text-transform: none; }
.visite-carte h3 { font-size: 21px; font-weight: 500; line-height: 1.25; margin: 10px 0 8px; letter-spacing: -.01em; }
.visite-carte p { color: var(--encre-2); font-size: 15px; }
.visite-carte .nav { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
.visite-carte .nav .espace { flex: 1; }
.visite-carte .barre { height: 4px; border-radius: 2px; background: var(--piste); margin-top: 16px; overflow: hidden; }
.visite-carte .barre i { display: block; height: 100%; background: var(--jaune); transition: width .3s; }

/* Pilotage : la constellation reste un décor, derrière le grand chiffre */

/* Les trois niveaux d'agents, en pyramide inversée : l'illustration au centre (440 × 500), les textes calés sur ses étages */
.pyr-agents { background: var(--carte); box-shadow: var(--ombre); border-radius: 24px; padding: 32px 36px 24px;
  display: grid; grid-template-columns: minmax(0, 1fr) 440px minmax(0, 1fr); grid-template-rows: auto 130px 130px 50px 190px auto; column-gap: 36px; }
.pyr-agents .pyr-t { grid-row: 1; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--gris); font-weight: 600; padding-bottom: 14px; }

.pyr-agents .pyr-qui { grid-column: 1; text-align: right; display: flex; flex-direction: column; gap: 4px; }

/* ---------- v12 · Thème sombre : les mêmes repères, sur fond nuit ---------- */
/* Choisi par le bouton de l'en-tête (data-theme sur <html>) ; sans choix, il suit le réglage de l'appareil. */
:root[data-theme="dark"] {
  /* Sombre, aux verts de Sécur'IA */
  --fond: #0f1412; --panneau: #151b18; --carte: #1c2420;
  --bleu: #86d3bc; --vif: #1b7d69; --vif-fonce: #166a59; --clair: #1f3d35; --pale: #1a2b26;
  --jaune: #7fb8a4; --jaune-pale: #22352f; --encre: #e4ebe8; --encre-2: #b5c0bb; --gris: #8b9792; --contour: #66726d; --filet: #2a3430;
  --ok: #74d6a4; --ok-pale: #163628; --att: #f2b95e; --att-pale: #3a2c12; --ko: #ff8f86; --ko-pale: #43201e;
  --titre: #eef3f1; --nuit: #0a2a23; --survol: #222c28; --neutre: #242e2a; --piste: #2a3430; --barre-f: #2f6b5b;
  --ombre: 0 1px 2px rgba(0, 0, 0, .4), 0 2px 8px rgba(0, 0, 0, .3);
  --ombre-haute: 0 4px 12px rgba(0, 0, 0, .45), 0 12px 32px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
:root[data-theme="dark"] .carte, :root[data-theme="dark"] .bande-ev { border: 1px solid var(--filet); }
:root[data-theme="dark"] .rail { border-right: 1px solid var(--filet); }
:root[data-theme="dark"] .marque img, :root[data-theme="dark"] .hub-c img { filter: brightness(0) invert(1); }
:root[data-theme="dark"] .constellation g[stroke] { stroke: #2f5a4f; }
:root[data-theme="dark"] .constellation g[fill] { fill: #86d3bc; }
:root[data-theme="dark"] .art { opacity: .9; }
:root[data-theme="dark"] .etoile.on { color: var(--jaune); }
:root[data-theme="dark"] .bande-ev.mes-p .pastille { color: var(--jaune); }
:root[data-theme="dark"] .avis-voile { background: rgba(0, 0, 0, .55); }
/* Sécur'IA, simulé, garde son propre habillage clair. */
:root[data-theme="dark"] .sia { --fond: #ffffff; --panneau: #f2f4f3; --carte: #fff; --encre: #1d2421; --encre-2: #3c4541; --gris: #77807c; --filet: #dfe3e1; --titre: #1d2421; --nuit: #0d3d33; --bleu: #0b6e5f; --vif: #0b6e5f; --pale: #eef4f1; --clair: #e3f1ec; --survol: #f2f4f3; color-scheme: light; }
.theme-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--encre-2); }
.theme-btn:hover { background: var(--survol); }

/* ---------- v12 · Un peu plus petit : textes et objets à 90 % ---------- */
.appli { zoom: .9; height: calc(100vh / .9); }

/* ---------- v12 · Thème Sécur'IA : exactement les couleurs de Sécur'IA ---------- */
:root[data-theme="securia"] {
  --fond: #ffffff; --panneau: #f2f4f3; --carte: #ffffff;
  --bleu: #0b6e5f; --vif: #0b6e5f; --vif-fonce: #095a4e; --clair: #e3f1ec; --pale: #eef4f1;
  --jaune: #7fb8a4; --jaune-pale: #e3f1ec; --encre: #1d2421; --encre-2: #3c4541; --gris: #77807c; --contour: #a9b1ad; --filet: #dfe3e1;
  --titre: #1d2421; --nuit: #0d3d33; --survol: #f2f4f3; --neutre: #f2f4f3; --piste: #e3e6e4; --barre-f: #b9dccf;
  --ombre: none; --ombre-haute: 0 2px 10px rgba(29, 36, 33, .08);
}
:root[data-theme="securia"] .panneau { background: linear-gradient(180deg, #f7f8f7, #eceeed); }
:root[data-theme="securia"] .rail { border-right: 1px solid #e3e6e4; }
:root[data-theme="securia"] .carte, :root[data-theme="securia"] .bande-ev { border: 1px solid var(--filet); }
:root[data-theme="securia"] .constellation g[stroke] { stroke: #9fcdbd; }
:root[data-theme="securia"] .constellation g[fill] { fill: #0b6e5f; }
:root[data-theme="securia"] .etoile.on { color: #0b6e5f; }
.themes { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid var(--filet); background: var(--carte); }
.themes button { width: 34px; height: 30px; border-radius: 999px; display: grid; place-items: center; color: var(--gris); }
.themes button .ic { font-size: 19px; }
.themes button:hover { background: var(--survol); }
.themes button.on { background: var(--clair); }
.themes button.on .ic { font-variation-settings: "FILL" 1; }
.themes .t-securia.on .ic { color: #0b6e5f; } .themes .t-light.on .ic { color: #1f368b; } .themes .t-dark.on .ic { color: #86d3bc; }


/* Le Hub IA, c'est quoi : ce qu'il fait, le plan, les fiches */
.verbe .dessin { height: 84px; display: grid; place-items: center start; margin-bottom: 4px; }
.verbe .dessin svg { height: 80px; width: auto; }
.verbe h3 { display: flex; align-items: center; gap: 10px; }
.verbe .num { width: 26px; height: 26px; border-radius: 50%; background: var(--vif); color: #fff; font-size: 14px; display: grid; place-items: center; flex: none; }
.d-gris rect, .d-gris circle, rect.d-gris { fill: var(--filet); }
.d-vif rect, .d-vif, .d-vif circle { fill: var(--vif); }
.d-carte { fill: var(--pale); }
.d-bord { stroke: var(--vif); stroke-width: 2.5; }
.d-fleche { fill: none; stroke: var(--gris); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.d-fil line { stroke: var(--barre-f); stroke-width: 1.6; }
.d-fil .d-fil-v { stroke: var(--vif); stroke-width: 2.5; }

.plan-voir { justify-content: center; margin-bottom: 16px; }
.plan { background: var(--carte); border-radius: var(--r-carte); padding: 22px 24px 24px; }
.plan-hub { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-radius: 18px; background: var(--pale); outline: 2px solid var(--clair); margin-left: 192px; }
.plan-hub img { height: 22px; }
.plan-hub b { font-size: 18px; font-weight: 500; color: var(--titre); }
.plan-hub > span { color: var(--gris); font-size: 14px; }
.plan-hub .verbes { margin-left: auto; color: var(--vif); font-weight: 500; }
.plan-fils { display: grid; grid-template-columns: 180px repeat(3, minmax(0, 1fr)); column-gap: 12px; height: 26px; }
.plan-fils span { position: relative; }
.plan-fils span:not(:first-child)::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 2px solid var(--barre-f); }
.plan-fils span:nth-child(2)::before, .plan-fils span:nth-child(3)::before, .plan-fils span:nth-child(4)::before { content: ""; position: absolute; top: 0; border-top: 2px solid var(--barre-f); }
.plan-fils span:nth-child(2)::before { left: 50%; right: -12px; }
.plan-fils span:nth-child(3)::before { left: 0; right: -12px; }
.plan-fils span:nth-child(4)::before { left: 0; right: 50%; }
.plan-grille { display: grid; grid-template-columns: 180px repeat(3, minmax(0, 1fr)); gap: 12px; }
.plan-col { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-radius: 14px; background: var(--neutre); font-size: 14px; font-weight: 500; color: var(--titre); }
.plan-ligne { display: flex; align-items: center; gap: 10px; padding: 0 6px; color: var(--bleu); }
.plan-ligne b { color: var(--titre); font-weight: 500; font-size: 15px; line-height: 1.25; }
.plan-case { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 16px; border: 1px dashed var(--filet); }
.plan-e { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; border-radius: 12px; background: var(--pale); color: var(--bleu); text-decoration: none; transition: opacity .2s, filter .2s, background .15s; }
.plan-e:hover { background: var(--clair); }
.plan-e b { display: block; color: var(--titre); font-weight: 500; font-size: 14px; }
.plan-e small { display: block; color: var(--gris); font-size: 12.5px; }
.plan-e.off { opacity: .22; filter: grayscale(1); }
.plan-compte { text-align: center; margin-top: 14px; color: var(--encre-2); font-size: 15px; }
.fiche-ia dl { display: grid; grid-template-columns: 110px 1fr; gap: 10px 14px; margin: 4px 0 0; padding-top: 12px; border-top: 1px solid var(--filet); }
.fiche-ia dt { font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--gris); padding-top: 2px; }
.fiche-ia dd { margin: 0; color: var(--encre); font-size: 14.5px; }
.hub-fin { text-align: center; margin-top: 18px; font-size: 17px; color: var(--encre-2); }
@media (max-width: 760px) {
  .plan-fils { display: none; }
  .plan-grille { grid-template-columns: 1fr; }
  .plan-grille > div:first-child, .plan-col { display: none; }
  .plan-hub { flex-wrap: wrap; } .plan-hub .verbes { margin-left: 0; width: 100%; }
}
:root[data-theme="dark"] .plan-hub img { filter: brightness(0) invert(1); }

/* Le Hub IA, c'est quoi : le schéma en étoile */

<script>

(function () {
  const D = window.REPERE12;

  // ---------- Outils ----------
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const ic = (n, c = "") => `<span class="ic ${c}" aria-hidden="true">${n}</span>`;
  const par = (liste, id) => liste.find(x => x.id === id);
  const agent = id => par(D.agents, id);
  // Chaque agent a un identifiant de registre : AGT-GRP-… pour les agents du Groupe, AGT-LCL-… pour ceux de LCL.
  { let g = 0, l = 100; D.agents.filter(a => !a.raccourci).forEach((a, i) => {
    a.code = a.code || (a.groupe ? `AGT-GRP-${String(++g).padStart(4, "0")}` : `AGT-LCL-${String(++l).padStart(4, "0")}`);
    a.version = a.version || `${1 + i % 3}.${(i * 7) % 10}`; }); }
  const idAgent = (a, cls) => a.code ? `<button class="id-agent ${cls || ""}" data-act="copier-id" data-val="${a.code}" title="Copier l'identifiant">${a.code}</button>` : "";
  const outil = id => par(D.outils, id || "securia");
  const prompt = id => par(D.prompts, id), article = id => par(D.articles, id), evenement = id => par(D.evenements, id);
  const theme = k => D.themes.find(x => x[0] === k);

  const avatar = (nom, teinte) => `<span class="avatar t${teinte}">${esc(initiales(nom))}</span>`;

  const CLE = "repere12";

  try { memo = JSON.parse(localStorage.getItem(CLE) || "{}"); } catch (e) { memo = {}; }
  const etat = { compte: memo.compte || "claire", inscrit: memo.inscrit || ["midi-mail"], favoris: memo.fav || {}, avis: memo.avis || {}, vote: memo.vote || {}, filtre: "moi", filtreR: "tous", filtres: {}, q: "", toutesP: false, envoi: null, retour: "", fils: {}, pj: {} };
  // Les favoris sont gardés sous « fav » : ceux d'avant les prompts et les actualités (« favoris ») sont laissés de côté.

  const moi = () => par(D.comptes, etat.compte) || D.comptes[0];

  // ---------- Le décor de la v10 : le motif « constellation » derrière les titres ----------
  // Des étoiles placées au hasard, mais toujours les mêmes pour une page ; chacune reliée à sa voisine la plus proche.
  function hasard(graine) {
    let h = 2166136261; for (const c of String(graine)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
    return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; };
  }
  function liens(pts) {
    const vus = new Set(), out = [];
    pts.forEach((p, i) => {
      const v = pts.map((q, j) => [j, (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2]).filter(x => x[0] !== i).sort((a, b) => a[1] - b[1]).slice(0, i % 2 ? 1 : 2);
      v.forEach(([j]) => { const k = Math.min(i, j) + "-" + Math.max(i, j); if (!vus.has(k)) { vus.add(k); out.push([p, pts[j]]); } });

    const r = hasard(graine), pts = [];

    const c = pts.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i % 4 === 0 ? 5 : 3}" class="${i % 4 === 0 ? "et j" : "et"}" style="animation-delay:${(i * 0.37) % 3}s"/>`).join("");
    return `<svg class="constellation" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="opacity:${opac}">
      <g stroke="#9fb3f5" stroke-width="1.2" stroke-opacity=".55">${l}</g><g fill="#3e61e1">${c}</g></svg>`;
  }

  const FONDS = { agents: ["#dfe7ff", "#b9c9ff"], communaute: ["#fff3bf", "#dfe7ff"], regles: ["#e8ecf6", "#d7e1ff"], construire: ["#dfe7ff", "#fff1b0"],

  function art(theme, graine, h = 200) {

    const formes = [
      `<circle cx="${300 + r() * 60}" cy="${50 + r() * 50}" r="${60 + r() * 30}" fill="${nuit ? "#ffd204" : "#3e61e1"}" opacity="${nuit ? .95 : .18}"/>`,

      `<path d="M${180 + r() * 40} ${h - 30} l55 -95 l55 95 z" fill="#ffd204" opacity="${nuit ? .35 : .55}"/>`,
      `<rect x="${250 + r() * 40}" y="${h - 90}" width="46" height="46" rx="8" fill="${nuit ? "#fff" : "#2f50d0"}" opacity=".25" transform="rotate(45 ${273 + r() * 40} ${h - 67})"/>`

    return `<div class="art" style="height:${h}px"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs><linearGradient id="g-${esc(graine)}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>
      <rect width="${w}" height="${h}" fill="url(#g-${esc(graine)})"/>${formes}${constellation(w, h, graine, 9, nuit ? .55 : .9).replace(/^<svg[^>]*>/, "<g>").replace(/<\/svg>$/, "</g>")}</svg></div>`;
  }

  // ---------- Petits composants ----------
  const tete = (titre, sous) => `<div class="hero tete-h">${constellation(1200, 200, "tete-" + titre, 12, .6)}<header class="tete"><h1>${titre}</h1>${sous ? `<p>${sous}</p>` : ""}</header></div>`;

  // Ouvrir un agent là où il tourne : Sécur'IA (simulé), ou un autre outil du catalogue (annoncé seulement).
  const ouvrir = (id, q, cls = "btn", texte) => {
    const a = id && agent(id), o = outil(a && a.outil);

    return `<button class="${cls}" data-act="sia" data-id="${id}"${q ? ` data-q="${esc(q)}"` : ""}>${ic("open_in_new")}${texte || "Ouvrir dans Sécur'IA"}</button>`;
  };
  const etiqPour = a => a.pour.includes("tous") ? `<span class="etiq neutre">Pour tous</span>` : `<span class="etiq">${a.pour.map(m => par(D.metiers, m).court).join(" · ")}</span>`;
  const carteAgent = a => `<article class="carte agent-c">
      <div class="haut-c"><span class="pastille">${ic(a.icone)}</span><span class="etiqs">${a.outil ? `<span class="etiq neutre">${esc(outil(a.outil).nom)}</span>` : ""}${a.statut ? `<span class="etiq ${a.statut[0]}">${a.statut[1]}</span>` : etiqPour(a)}${etoile(a.id)}</span></div>

  const accesOutil = o => o.pour.includes("tous") || (moi().acces || []).includes(o.id);

  const pourMoiP = p => p.pour.includes("tous") || p.pour.includes(moi().pour) || p.pour.includes(moi().role);
  // Un prompt : son thème, le texte à copier, et deux gestes : le copier, ou l'ouvrir dans Sécur'IA.
  const cartePrompt = p => `<article class="carte prompt-c">
      <div class="haut-c"><span class="etiq">${ic(theme(p.theme)[2], "s18")}${esc(theme(p.theme)[1])}</span>${etoile(p.id)}</div>
      <h3>${esc(p.titre)}</h3><div class="meta"><span>${ic("thumb_up", "s18")}${String(p.note).replace(".", ",")} / 5</span><span>${ic("content_copy", "s18")}${nombre(p.copies)} copies</span></div>
      <p class="prompt-t"><span class="clamp4">${esc(p.texte)}</span></p>
      <div class="actions"><button class="btn" data-act="copier" data-id="${p.id}">${ic("content_copy")}Copier</button><button class="btn contour" data-act="prompt-sia" data-id="${p.id}">${ic("open_in_new")}Dans Sécur'IA</button></div></article>`;
  const iconeSujet = s => ({ "Réussites": "emoji_events", "Communauté": "groups", "Sécur'IA": "forum", "Bons usages": "rule", "Projets": "construction" }[s] || "newspaper");
  function carteArticle(a, grand) {
    if (grand) return `<article class="carte une">${art(a.image, a.id, 320)}<div class="corps"><span class="etiq jaune" style="align-self:flex-start">${ic("newspaper", "s18")}À la une · ${esc(a.sujet)}</span><h2>${esc(a.titre)}</h2><p class="desc">${esc(a.chapo)}</p>
      <div class="meta"><span>${esc(a.source)}</span><span>${a.d}</span><span>${a.lecture} min de lecture</span></div><div class="actions"><a class="btn" href="#article/${a.id}">Lire l'article</a>${etoile(a.id)}</div></div></article>`;

      <div class="actions"><a class="btn contour" href="#article/${a.id}">Lire</a></div></article>`;
  }
  const carteFavori = id => agent(id) ? carteAgent(agent(id)) : prompt(id) ? cartePrompt(prompt(id)) : article(id) ? carteArticle(article(id)) : outil(id) ? carteOutil(outil(id)) : "";
  // Les favoris, rangés par thème : les agents (et les outils), les prompts, les actualités.
  const FAV = [["agents", "Mes agents favoris", "smart_toy", id => agent(id) || outil(id)], ["prompts", "Mes prompts favoris", "edit_note", prompt], ["articles", "Mes articles favoris", "newspaper", article]];
  const favDe = k => favoris().filter(FAV.find(x => x[0] === k)[3]);
  const pourMoiEv = e => !e.pour || e.pour === moi().pour || e.pour === moi().role || (e.pour === "champion" && moi().role === "officer");
  const btnInscrire = (e, jaune) => etat.inscrit.includes(e.id) ? `<button class="btn fait" data-act="inscrire" data-id="${e.id}">${ic("check")}Inscrit</button>` : `<button class="btn ${jaune ? "jaune" : ""}" data-act="inscrire" data-id="${e.id}">S'inscrire</button>`;
  const inscrits = e => e.inscrits + (etat.inscrit.includes(e.id) ? 1 : 0);
  // La carte d'événement de la v10 : la date, le type, le titre, le lieu, une phrase, qui anime, les places.
  function carteEvenement(e, compact) {

      ${compact ? "" : `<p class="desc clamp2">${esc(e.desc)}</p>
      <div class="meta">${e.anime ? `<span>${ic("person", "s18")}Animé par ${esc(e.anime)}</span>` : ""}<span>${reste > 0 ? reste + (reste > 1 ? " places restantes" : " place restante") : "Complet, liste d'attente"}</span></div>`}
      <div class="actions">${btnInscrire(e)}${compact ? "" : `<a class="btn texte" href="#evenement/${e.id}">Détails</a>`}</div></div></article>`;

  const liste = lignes => `<div class="carte chantiers">${lignes.join("")}</div>`;
  const ligneEtat = (k, e, t, s, x = "") => `<div class="chantier"><span class="etiq ${k}">${e}</span><b>${esc(t)}${x}</b><span>${esc(s)}</span></div>`;

  // ---------- Les pages : une page, une information ----------
  const P = {};

  // La recherche de l'accueil : elle trouve dans Repère ce qui concerne la personne (agents, prompts, règles, actualités, pages).
  // Si rien ne répond, ou en dernier recours, on peut poser la question à Sécur'IA.
  const indexRecherche = () => {
    const c = moi(), m = metier();
    return [
      ...D.agents.filter(a => !a.raccourci && pourMoi(a)).map(a => ["smart_toy", "Agent", a.nom, a.fait, `#agent/${a.id}`]),
      ...D.prompts.filter(pourMoiP).map(p => ["edit_note", "Prompt", p.titre, theme(p.theme)[1], "#prompts", `data-act="voir-prompt" data-id="${p.id}"`, p.texte]),

      ...D.regles.non.map(t => ["block", "Règle", t, "Non, jamais dans Sécur'IA", "#regles", "", "données confidentiel"]),
      ...D.articles.filter(pourMoiA).map(a => ["newspaper", "Actualité", a.titre, a.chapo, `#article/${a.id}`]),
      ...(masque("outils") ? [] : D.outils.filter(o => !o.construction).map(o => ["apps", "Outil", o.nom, o.fait, "#outils"])),
      ...(masque("evenements") ? [] : D.evenements.filter(pourMoiEv).map(e => ["calendar_month", "Événement", e.titre, `${e.date} · ${e.lieu}`, "#evenements"])),
      ...(m ? [[m.icone, "Page", m.nom, m.qui, `#metier/${m.id}`]] : []),
      ...((m && m.id === "it") || c.role === "officer" ? [["cable", "Page", "Services et MCP", "Connecteurs et serveurs MCP mis à disposition par la DSI", "#services", "", "mcp connecteur api"]] : []),
      ...(c.role === "officer" ? [["inventory", "Page", "Registre des agents", "Tous les agents de LCL, quel que soit l'outil", "#registre"], ["monitoring", "Page", "Suivi des agents", "Le tableau de bord de chaque agent", "#tableau"]] : []),
      ...(c.role === "champion" ? [["military_tech", "Page", "Espace AI Champions", "Vos cas d'usage remontés, le kit d'animation", "#champion", "", "animer kit"]] : []),
      ["diversity_3", "Page", "Les AI Champions", "Trouver le vôtre, ou le devenir", "#champions", "", "communauté champion"],
      ...(pourQui(CONSTRUIT) ? [["construction", "Page", "Construire un agent", "Mon agent est-il bon, partageable, à industrialiser ?", "#construire", "", "partager déclarer industrialisation test"], ["quiz", "Page", "Quelle démarche pour mon cas ?", "Six questions, la démarche qui s'applique", "#cadre/demarche"]] : []),
      ...(pourQui(ACTEURS) ? [["warning", "Page", "Les niveaux de risque", "AI Act : inacceptable, haut, limité, minimal", "#cadre/risques", "", "ai act risque"], ["account_balance", "Page", "Le cadre normatif", "AI Act, Groupe, LCL, avis de l'AI Office", "#cadre/normatif"], ["policy", "Page", "L'instruction d'un cas d'usage", "Les pièces, les décisions, l'avis", "#cadre/instruction"],
        ["account_tree", "Page", "Le modèle opérationnel", "Le modèle, qui fait quoi, de l'idée à la revue, gouvernance, le cap", "#modele", "", "raci gouvernance"], ["route", "Page", "De l'idée à la revue", "Huit étapes, du besoin au run", "#modele/chaine"]] : []),
      ["school", "Page", "Apprendre", "Les formations à l'IA", "#apprendre"], ["rule", "Page", "Les règles", "Ce qu'on met, ce qu'on ne met pas", "#regles", "", "données client nom numéro de compte confidentiel"],
      ["info", "Page", "Le Hub IA, c'est quoi ?", "Le plan de l'offre d'IA de LCL", "#hub"]];
  };
  const resultats = q => {
    const c = moi(), mots = norm(q).split(" ").filter(x => x.length > 1);
    if (!mots.length) return `<div class="essayez">${(c.cherche || []).map(x => `<button class="puce" type="button" data-act="cherche" data-q="${esc(x)}">${ic("search", "s18")}${esc(x)}</button>`).join("")}</div>`;
    // Tous les mots d'abord ; à défaut, le plus de mots possible. Un mot du titre compte plus qu'un mot du reste.
    const notes = indexRecherche().map(r => { const t = norm(r[2]), tout = norm([r[1], r[2], r[3], r[6] || ""].join(" ")), n = mots.filter(x => tout.includes(x)).length;
      return n ? [n * 10 + mots.filter(x => t.includes(x)).length, n, r] : null; }).filter(Boolean);
    const max = Math.max(0, ...notes.map(x => x[1]));

    return `<ul class="resultats">${l.map(([i, type, t, s, h, attr]) => `<li><a href="${h}" ${attr || ""}><span class="pastille petite">${ic(i, "s20")}</span><span class="t"><b>${esc(t)}</b><span>${esc(type)} · ${esc(s)}</span></span>${ic("arrow_forward", "s18")}</a></li>`).join("")}

  P[""] = () => {
    const c = moi();

      : c.role === "officer" ? [`#registre`, "inventory", "Le registre des agents", `${nbRevoir} agents à revoir · ${D.registre.personnels + D.registre.equipes + processus().length} agents en tout`] : null;

  function colonneFav([k, n, i]) {

  // Mes favoris : rangés par thème, les agents, les prompts, les actualités.
  P.favoris = () => {

        ${themes.filter(t => v === "tous" || t[0] === v).map(([k, n, i, , ids]) => `<section class="section fav-s"><div class="section-t"><h2>${ic(i)}${n}</h2><a class="lien" href="${VIDE_FAV[k][0]}">${VIDE_FAV[k][1]}${ic("arrow_forward", "s18")}</a></div>
          ${ids.length ? `<div class="grille g3">${ids.map(carteFavori).join("")}</div>` : `<div class="carte vide-s">${ic("star", "s20")}Aucun pour l'instant : touchez l'étoile pour l'ajouter ici.</div>`}</section>`).join("")}`
        : `<div class="vide">${ic("star")}<b>Aucun favori pour l'instant</b><span>Touchez l'étoile d'un agent, d'un prompt ou d'un article pour le retrouver ici.</span><a class="btn" href="#prompts">Voir les prompts</a></div>`}`;
  };

  // La bibliothèque de prompts : un thème à la fois (ceux de votre métier) ; la recherche parcourt tous les thèmes.
  P.prompts = () => {
    const m = metier(), q = etat.q.trim().toLowerCase();
    const base = D.prompts.filter(p => etat.toutesP || !m || pourMoiP(p));
    const themes = D.themes.filter(t => base.some(p => p.theme === t[0]));
    const v = themes.some(t => t[0] === etat.filtres.prompts) ? etat.filtres.prompts : themes[0][0];
    const l = q ? base.filter(p => (p.titre + " " + p.texte).toLowerCase().includes(q)) : base.filter(p => p.theme === v);
    const favs = favoris().filter(prompt).length;

  // Les actualités : l'article à la une, puis les autres, par sujet. Le dessin de la v10.

  // Les outils : Sécur'IA pour l'essentiel, les autres pour des usages précis.

  P.outils = () => `${tete("Les outils", "Sécur'IA, le chat de tous les collaborateurs. En parallèle, chaque métier reçoit une IA intégrée à ses propres outils.")}

    <p class="note-bas" style="margin-top:6px">${ic("work", "s18")}L'IA propre à un métier, comme Conseiller augmenté dans le poste du conseiller, n'est pas dans Sécur'IA : elle est dans les outils du métier. <a class="lien-mini" href="#outils">Les outils</a></p>`;

  // Agents : ce que fait chaque agent, l'essayer, ou lire sa fiche.
  const enConstruction = a => a.statut && a.statut[1] === "En construction" ? 1 : 0;
  P.agents = () => {

      .sort((a, b) => enConstruction(a) - enConstruction(b)); // ce qui marche aujourd'hui d'abord
    return `${tete("Les agents", "Chaque agent sait faire une chose, bien. Il s'ouvre là où il tourne : le plus souvent Sécur'IA.")}
      <div class="puces">${(m ? [["moi", capitale(m.pourles)]] : []).concat([["commun", "Pour tous"], ["tous", "Tous les agents"]]).map(([k, n]) => `<button class="puce ${v === k ? "actif" : ""}" data-act="filtre" data-val="${k}">${v === k ? ic("check", "s18") : ""}${n}</button>`).join("")}</div>
      <div class="grille g3">${l.map(carteAgent).join("")}</div>
      <p class="note-bas">${ic("lightbulb", "s18")}Bientôt : ${D.bientot.map(([n, s]) => `<b>${n}</b> (${s.toLowerCase()})`).join(", ")}. Un besoin d'agent ? <button class="lien-mini" data-act="toast" data-msg="Le formulaire Agents et connecteurs s'ouvre (démonstration).">Proposez-le</button></p>`;

  // La fiche d'un agent : ce qu'il fait, ce qu'il sait, ce qu'il ne fait pas, qui le tient à jour.
  const pageAgent = id => {

    return `<a class="retour-l" href="#agents">${ic("arrow_back", "s18")}Les agents</a>

        <div class="etiqs">${etiqPour(a)}<span class="etiq neutre">${ic(o.icone, "s18")}${esc(o.nom)}</span>${idAgent(a, "etiq")}</div></div>${etoile(a.id)}</header>
      <div class="grille g3">
        <div class="carte fiche-b"><h3>${ic("lightbulb")}Ce qu'il sait</h3><ul>${a.sait.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>
        <div class="carte fiche-b"><h3>${ic("block")}Ce qu'il ne fait pas</h3><ul>${a.limites.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>
        <div class="carte fiche-b"><h3>${ic("info")}Bon à savoir</h3><dl>
          <dt>Pour qui</dt><dd>${a.pour.includes("tous") ? "Tous les collaborateurs" : capitale(a.pour.map(m => par(D.metiers, m).court.toLowerCase().replace(/^it$/, "IT")).join(", "))}</dd>
          <dt>Où</dt><dd>${esc(o.nom)}</dd><dt>Tenu à jour par</dt><dd>${esc(a.porteur)}</dd><dt>Mis à jour</dt><dd>${esc(a.maj)} · version ${a.version}</dd></dl></div>
      </div>
      ${moi().role === "officer" && statsAgent(a.id) ? `<a class="bande-ev role tb" href="#tableau/${a.id}"><span class="pastille">${ic("monitoring")}</span><span class="t"><b>Son tableau de bord</b><span>${nombre(statsAgent(a.id).semaines[11])} conversations cette semaine · ${statsAgent(a.id).utiles} % de réponses utiles</span></span>${ic("arrow_forward")}</a>` : ""}
      <div class="carte essai-f">${ic("chat_bubble")}<div><b>Essayez</b><span>« ${esc(a.exemple)} »</span></div>${ouvrir(a.id, a.exemple)}</div>`;

  // Les règles : deux listes, une phrase.
  P.regles = () => {
    const R = D.regles;
    return `${ongletsCadre("regles")}${tete("Ce qu'on met, ce qu'on ne met pas", "Deux listes à garder en tête dans Sécur'IA, l'IA de tous. L'IA intégrée à un métier a, en plus, la règle de ce métier.")}
      <div class="grille g2">
        <div class="carte regle oui"><h3>${ic("check_circle")}Vous pouvez y mettre</h3>${R.oui.map(t => `<div class="ligne-r">${ic("check", "s20")}${esc(t)}</div>`).join("")}</div>

  // Événements, au dessin de la v10 : un filtre par type, le grand rendez-vous de nuit, la liste, les replays.

  P.evenements = () => {
    const mes = D.evenements.filter(pourMoiEv), types = ["Tous", ...new Set(mes.map(e => e.type))], v = etat.filtres.evenements || "Tous";
    const une = mes.find(e => e.une), l = mes.filter(e => !e.une && (v === "Tous" || e.type === v));
    return `${tete("Événements", "Midis de l'IA, ateliers, webinaires et le Data & AI Day : apprendre ensemble, près de chez vous ou sur Teams.")}
      <div class="puces">${types.map(t => `<button class="puce ${v === t ? "actif" : ""}" data-act="filtre-e" data-val="${esc(t)}">${v === t ? ic("check", "s18") : ""}${esc(t)}</button>`).join("")}</div>
      ${une && (v === "Tous" || v === une.type) ? `<article class="carte une ev-une">${art("evenement", "dad", 340)}<div class="corps"><span class="etiq jaune" style="align-self:flex-start">${ic("emoji_events", "s18")}Le grand rendez-vous</span><h2>${esc(une.titre)}</h2><p class="desc">${esc(une.desc)}</p>
        <div class="meta"><span>${ic("calendar_month", "s18")}${une.date}, ${une.heure}</span><span>${ic("location_on", "s18")}${une.lieu}</span></div>
        <div><div class="progression jaune"><i style="width:${Math.round(100 * inscrits(une) / une.places)}%"></i></div><div class="meta" style="margin-top:6px">${nombre(inscrits(une))} inscrits sur ${une.places} places</div></div>
        <div class="actions">${btnInscrire(une, true)}<a class="btn texte" href="#evenement/${une.id}">Le programme</a></div></div></article>` : ""}
      ${l.length ? `<section class="section"><div class="section-t"><h2>À venir</h2></div><div class="grille g2">${l.map(e => carteEvenement(e)).join("")}</div></section>` : ""}
      <section class="section"><div class="section-t"><h2>Replays</h2></div><div class="grille g3">${D.replays.map(e => `<article class="carte ev"><div class="date-ev passe">${e.jour ? `<b>${e.jour}</b><span>${e.mois}</span>` : ic("play_circle")}</div><div class="corps"><span class="etiq neutre" style="align-self:flex-start">${esc(e.type)}</span><h3>${esc(e.titre)}</h3><div class="meta">${ic("play_circle", "s18")}${nombre(e.vues)} vues</div><div class="actions"><button class="btn contour" data-act="toast" data-msg="« ${esc(e.titre)} » s'ouvre dans Stream (démonstration).">${ic("play_arrow")}Revoir</button></div></div></article>`).join("")}</div></section>`;
  };
  // La fiche d'un événement : la description, le programme, et l'inscription à côté.
  const pageEvenement = id => {
    const e = evenement(id); if (!e) return introuvable();
    return `<a class="retour-l" href="#evenements">${ic("arrow_back", "s18")}Événements</a>
      <div class="grille g-2-1"><div class="carte lecture">${art(e.une ? "evenement" : "communaute", e.id, 220)}<div class="corps-l">
        <span class="etiq neutre" style="align-self:flex-start">${ic(e.icone, "s18")}${esc(e.type)}</span><h1>${esc(e.titre)}</h1><p class="chapo">${esc(e.desc)}</p>
        ${e.programme ? `<h3>Le programme</h3><table class="tableau"><tbody>${e.programme.map(([h, x]) => `<tr><td class="h">${h}</td><td>${esc(x)}</td></tr>`).join("")}</tbody></table>` : ""}</div></div>
        <div class="col-ev">${carteEvenement(e, true)}${e.anime ? `<div class="carte"><div class="meta">Animé par</div><h3>${esc(e.anime)}</h3></div>` : ""}<div class="carte"><div class="meta">Places</div><h3>${nombre(inscrits(e))} inscrits sur ${nombre(e.places)}</h3><div class="progression"><i style="width:${Math.round(100 * inscrits(e) / e.places)}%"></i></div></div></div></div>`;
  };

  // Apprendre : trois parcours, et des exercices de dix minutes.
  P.apprendre = () => {
    const [enCours, fait] = D.progression[moi().id] || ["decouvrir", 0];
    return `${tete("Apprendre", "Trois parcours, à votre rythme. Commencez par le premier : une heure trente suffit.")}
      <div class="grille g3">${D.parcours.map(p => { const v = p.id === enCours ? Math.round(100 * fait / p.modules.length) : 0; return `<article class="carte"><div class="haut-c"><span class="pastille ${p.id === enCours ? "jaune" : ""}">${ic(p.icone)}</span><span class="etiq neutre">${p.duree}</span></div>
        <h3>${esc(p.nom)}</h3><div class="meta">${esc(p.pour)}</div>
        <ol class="modules">${p.modules.map((m, i) => `<li class="${p.id === enCours && i < fait ? "fait" : ""}">${esc(m === "Les agents de son métier" && metier() ? "Les agents " + metier().de : m)}</li>`).join("")}</ol>
        ${p.id === enCours ? `<div class="progression"><i style="width:${v}%"></i></div>` : ""}
        <div class="actions"><button class="btn ${p.id === enCours ? "" : "contour"}" data-act="toast" data-msg="Le module s'ouvre dans l'outil de formation (démonstration).">${p.id === enCours ? "Continuer" : "Commencer"}</button></div></article>`; }).join("")}</div>
      <section class="section"><div class="section-t"><h2>Essayer en dix minutes</h2></div>
        <div class="grille g4">${D.ateliers.map(([i, t, d]) => `<button class="carte exo" data-act="toast" data-msg="L'exercice s'ouvre dans Sécur'IA, pas à pas (démonstration).">${ic(i)}<b>${esc(t)}</b><span>${d} min</span></button>`).join("")}</div></section>`;
  };

  // ---------- Les chiffres : chacun les siens ----------
  // Un collaborateur voit ses chiffres, ceux de son équipe et trois repères pour LCL.
  // L'AI Officer voit le tableau de bord : l'usage de LCL, les agents à surveiller, et le tableau de bord de chaque agent.
  const T = D.tableau;
  // La semaine k (0 à 11) : la plus récente commence le lundi 26 octobre.
  const semaineDe = k => { const d = new Date(2026, 9, 26 - 7 * (11 - k)); return "sem. du " + d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }); };
  const somme4 = s => s.slice(-4).reduce((a, b) => a + b, 0);
  const tendance = s => { const a = s.slice(-8, -4).reduce((x, y) => x + y, 0), b = somme4(s); return a ? Math.round(100 * (b - a) / a) : null; };
  const etiqTendance = s => { const v = tendance(s); return v == null ? "" : `<span class="tend ${v > 2 ? "hausse" : v < -2 ? "baisse" : ""}">${ic(v > 2 ? "trending_up" : v < -2 ? "trending_down" : "trending_flat", "s18")}${v > 0 ? "+" : ""}${v} %</span>`; };
  const pc = n => n + " %";
  // Un histogramme à une seule série : douze semaines, une couleur, une infobulle par barre.
  function histo(s, unite, h = 180) {
    const w = 600, max = Math.max(...s, 1), haut = Math.ceil(max / Math.pow(10, String(Math.floor(max)).length - 1)) * Math.pow(10, String(Math.floor(max)).length - 1);
    const pas = w / s.length, lb = pas - 6, y0 = h - 22;
    const barres = s.map((v, k) => { const bh = Math.max(v ? 2 : 0, (y0 - 8) * v / haut), x = k * pas + 3, y = y0 - bh, r = Math.min(4, bh);
      return `<g class="b ${k === s.length - 1 ? "der" : ""}" data-tip="${semaineDe(k)} : ${nombre(v)} ${unite}" tabindex="0"><rect class="cible" x="${k * pas}" y="0" width="${pas}" height="${y0}"/>
        <path d="M${x} ${y0} V${y + r} Q${x} ${y} ${x + r} ${y} H${x + lb - r} Q${x + lb} ${y} ${x + lb} ${y + r} V${y0} Z"/></g>`; }).join("");
    return `<svg class="histo" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(unite)} par semaine, sur douze semaines : de ${nombre(s[0])} à ${nombre(s[s.length - 1])}">
      <line class="grille-h" x1="0" x2="${w}" y1="8" y2="8"/><text class="ax" x="${w}" y="4" text-anchor="end">${nombre(haut)}</text>
      ${barres}<line class="base" x1="0" x2="${w}" y1="${y0}" y2="${y0}"/>
      <text class="ax" x="0" y="${h - 4}">${semaineDe(0)}</text><text class="ax" x="${w}" y="${h - 4}" text-anchor="end">${semaineDe(s.length - 1)}</text></svg>`;
  }
  // Une petite tendance dans une ligne de tableau.
  const mini = s => { const max = Math.max(...s, 1); return `<span class="mini" aria-hidden="true">${s.map((v, k) => `<i style="height:${Math.max(v ? 8 : 0, Math.round(100 * v / max))}%" class="${k === s.length - 1 ? "der" : ""}"></i>`).join("")}</span>`; };
  const tuile = (n, t, x = "") => `<div class="carte kpi tuile"><b>${n}</b><span>${t}</span>${x}</div>`;

  P.chiffres = () => moi().role === "officer" ? vueDirection() : mesChiffres();

  // Pour un collaborateur : vous, votre équipe, et LCL en trois repères.
  function mesChiffres() {
    const c = moi(), M = D.mesChiffres[c.id];
    if (!M) return `${tete("Quelques chiffres", "Où en est l'IA chez LCL, ce mois-ci.")}<div class="grille g3">${D.chiffres.map(([n, x]) => tuile(n, esc(x))).join("")}</div>`;
    const mois = somme4(M.semaines), minutes = mois * 5, gagne = Math.floor(minutes / 60) + " h " + String(minutes % 60).padStart(2, "0");
    const maxA = Math.max(...M.agentsUtilises.map(x => x[1])), part = Math.round(100 * M.actifs / M.collegues);
    return `${tete("Mes chiffres", "Ce que l'IA vous apporte, et où en est votre équipe. Vos chiffres ne sont visibles que par vous.")}
      <div class="grille g3">${tuile(mois, "conversations avec l'IA ces quatre dernières semaines", etiqTendance(M.semaines))}${tuile(gagne, "de temps gagné, estimé sur le mois")}${tuile(M.prompts, "prompts de la bibliothèque copiés")}</div>
      <div class="grille g-2-1 section"><div class="carte"><h3>Vos conversations, semaine après semaine</h3>${histo(M.semaines, "conversations")}</div>
        <div class="carte"><h3>Vos agents</h3><div class="barres">${M.agentsUtilises.sort((a, b) => b[1] - a[1]).map(([id, n]) => `<div class="barre"><a href="#agent/${id}">${esc(agent(id).nom)}</a><i><b style="width:${Math.round(100 * n / maxA)}%"></b></i><em>${n}</em></div>`).join("")}</div><p class="desc petit">Conversations du mois, par agent.</p></div></div>
      <section class="section"><div class="section-t"><h2>${esc(M.equipe)}</h2></div>
        <div class="carte equipe-c"><div><b>${M.actifs} sur ${M.collegues}</b><span>${M.collegues > 100 ? "collaborateurs" : "collègues"} ont utilisé l'IA ce mois-ci</span></div>
          <div class="compare"><div class="barre"><span>${esc(M.equipe)}</span><i><b style="width:${part}%"></b></i><em>${part} %</em></div><div class="barre lcl"><span>LCL</span><i><b style="width:23%"></b></i><em>23 %</em></div></div></div></section>
      <section class="section"><div class="section-t"><h2>Chez LCL</h2></div><div class="grille g3">${[D.chiffres[1], D.chiffres[3], D.chiffres[4]].map(([n, x]) => tuile(n, esc(x))).join("")}</div></section>
      <p class="note-bas">${ic("info", "s18")}Temps gagné : une estimation, cinq minutes par conversation. Chiffres simulés pour le prototype.</p>`;
  }

  // Pour l'AI Officer : l'usage de LCL, puis les agents à surveiller.
  const statsAgent = id => T.agents[id];
  const aSurveiller = id => { const s = statsAgent(id); return s && (s.alerte || s.utiles < 80 || s.signalements >= 5 || D.registre.revoir.includes(id)); };
  const agentsSuivis = () => Object.keys(T.agents).map(agent).filter(Boolean);

  // Le tableau de bord des agents : une ligne par agent suivi par LCL.

        ${l.map(a => { const s = statsAgent(a.id), u = D.registre.utilisateurs[a.id] || 0, sv = aSurveiller(a.id);

            <td class="nb ${s.utiles < 80 ? "faible" : ""}">${pc(s.utiles)}</td><td class="nb">${pc(s.sansReponse)}</td><td class="nb">${s.signalements}</td><td><span class="etiq ${sv ? (s.utiles < 80 || D.registre.revoir.includes(a.id) ? "ko" : "att") : "ok"}">${sv ? (s.utiles < 80 || D.registre.revoir.includes(a.id) ? "À revoir" : "À suivre") : "En service"}</span></td></tr>`; }).join("")}

  const pageTableau = id => {

      <header class="fiche-t">${constellation(1200, 180, "tb-" + a.id, 10, .5)}<span class="pastille grande">${ic(a.icone)}</span><div><h1>${esc(a.nom)}</h1><p>${esc(a.fait)}</p>

  // L'IA par métier : trois métiers posés sur un même socle, et trois principes.

    <div class="etages">
      <div class="grille g3">${D.metiers.map(m => `<a class="carte metier-c ${m.id === moi().pour ? "moi" : ""}" href="#metier/${m.id}">
        <div class="haut-c"><span class="pastille">${ic(m.icone)}</span>${m.id === moi().pour ? `<span class="etiq">Votre métier</span>` : ""}</div>

        <div class="ajoute">${ic("add", "s18")}${m.integre ? esc(outil(m.integre).nom) + ", " : ""}${D.agents.filter(a => !a.pour.includes("tous") && a.pour.includes(m.id)).length} agents, une règle</div></a>`).join("")}</div>

    <div class="grille g3 section">${[["call_split", "Deux IA qui s'articulent", "Sécur'IA, le chat de tous, sans donnée client nominative. Et l'IA intégrée aux outils de chaque métier : Conseiller augmenté dans le poste du conseiller, Copilot et Claude Code pour les développeurs."],

  // Pour l'IT : le catalogue de services, les connecteurs, les serveurs MCP.

  const registre = () => processus().concat(D.registre.equipe);

  const repartir = (parts, total) => { const x = parts.map(p => p * total), n = x.map(Math.floor); let reste = total - n.reduce((a, b) => a + b, 0);
    x.map((v, i) => [v - n[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (reste > 0) { n[i]++; reste--; } }); return n; };

    return `<div class="carte"><h3>${titre}</h3><div class="barres">${lignes.map(([nom, p], i) => `<div class="barre"><span>${esc(nom)}</span><i><b style="width:${Math.round(p * 100)}%"></b></i><em>${n[i]}</em></div>`).join("")}</div></div>`; };
  P.registre = () => {

  // Le Hub IA, c'est quoi : pourquoi un Hub IA, ce qu'il fait (organiser, clarifier, simplifier l'accès), le plan de l'offre d'IA, une même grille pour chaque outil.

  const PLAN = {
    lignes: [["bolt", "Utiliser l'IA"], ["school", "Se former et bien l'utiliser"], ["trending_up", "Suivre et faire progresser"]],
    cols: [["groups", "Tous les collaborateurs"], ["work", "Par métier"], ["engineering", "Les acteurs de l'IA"]],
    cases: [
      [[["forum", "Sécur'IA, l'assistant de tous", "#securia", "*"], ["smart_toy", "Les agents ouverts à tous", "#agents", "*"]],
       [["co_present", "Conseiller augmenté", "#metier/conseillers", "claire julien helene", "Conseillers · en construction"], ["inventory_2", "Agents des opérations, Dataiku", "#metier/operations", "thomas helene", "Opérations"], ["terminal", "Copilot, Claude Code, Sécuri'Dev", "#metier/it", "samir helene", "IT et développeurs"]],

  function voirPlan(v) {
    const es = [...document.querySelectorAll(".plan-e")], n = es.filter(e => !v || e.dataset.qui === "*" || e.dataset.qui.split(" ").includes(v)).length;
    es.forEach(e => e.classList.toggle("off", !!v && e.dataset.qui !== "*" && !e.dataset.qui.split(" ").includes(v)));
    document.querySelectorAll("[data-act=plan-voir]").forEach(b => b.classList.toggle("actif", b.dataset.val === v));
    const p = VOIR.find(x => x[0] === v), c = document.querySelector(".plan-compte");
    if (c) c.textContent = v ? `Vue de ${p[1].split(",")[0]} : ${n} entrées sur ${es.length}, uniquement celles qui concernent son métier et son rôle.` : `Le plan complet compte ${es.length} entrées. Choisissez un profil pour voir ce que le Hub lui affiche.`;
  }
  // Le schéma en étoile : Repère au centre, l'offre d'IA autour, rangée en trois usages (trois arcs). Chaque entrée dit à qui elle s'adresse.
  const ETOILE = [
    ["Utiliser l'IA", [500, 122], [[-152, "forum", "Sécur'IA", "Tous les collaborateurs", "#securia"], [-114, "smart_toy", "Les agents", "Pour tous, ou par métier", "#agents"],
      [-66, "work", "L'IA intégrée aux métiers", "Conseiller augmenté, opérations…", "#metiers"], [-28, "terminal", "Les outils de développement", "Copilot, Claude Code", "#metier/it"]]],
    ["Se former et bien l'utiliser", [355, 404], [[160, "school", "Les formations", "Selon votre métier", "#apprendre"], [118, "rule", "Les règles et les prompts", "Au moment d'agir", "#regles"]]],
    ["Suivre et faire progresser", [645, 404], [[62, "newspaper", "Actualités et événements", "Ce qui change", "#actualites"], [20, "rate_review", "Vos avis, les usages", "Pour faire progresser le Hub", "#avis"]]]];
  function schemaHub() {
    const W = 1000, H = 540, cx = 500, cy = 270, rx = 400, ry = 215, rad = a => a * Math.PI / 180, P2 = (a, kx = rx, ky = ry) => [cx + kx * Math.cos(rad(a)), cy + ky * Math.sin(rad(a))];
    const pts = ETOILE.flatMap(([, , ns]) => ns.map(([a, ...r]) => [...P2(a), ...r]));
    const arc = (a1, a2) => { const [x1, y1] = P2(a1, rx + 0, ry + 0), [x2, y2] = P2(a2); return `M${x1} ${y1} A${rx} ${ry} 0 0 1 ${x2} ${y2}`; };
    const secteurs = ETOILE.map(([t, [lx, ly], ns]) => { const as = ns.map(n => n[0]), a1 = Math.min(...as) - 14, a2 = Math.max(...as) + 14;
      return `<path class="secteur" d="${arc(a1, a2)}"/><text x="${lx}" y="${ly}">${t}</text>`; }).join("");
    const lignes = pts.map(([x, y], i) => `<line x1="${x}" y1="${y}" x2="${cx}" y2="${cy}"/><line class="flux" x1="${x}" y1="${y}" x2="${cx}" y2="${cy}" style="animation-delay:-${i * .4}s"/>`).join("");

  // L'agent « travaille » : les étapes s'affichent une à une, puis la réponse s'écrit, puis les sources et les suites.
  function animer() {
