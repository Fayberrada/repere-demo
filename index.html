        <button class="btn" data-act="toast" data-msg="Conversation Teams ouverte avec ${esc(mien.nom)} (démonstration).">${ic("chat")}Lui écrire</button></div>` : ""}
      ${moiChamp ? `<a class="bande-ev role" href="#champion"><span class="pastille">${ic("military_tech")}</span><span class="t"><b>Votre espace AI Champion</b><span>Vos cas d'usage remontés, le kit d'animation</span></span>${ic("arrow_forward")}</a>` : ""}
      ${section("Les AI Champions", `<div class="grille g4">${V.champions.filter(c => c !== mien).map(carte).join("")}</div>`)}
      ${moiChamp ? "" : `<div class="carte devenir"><div class="t"><h2>Devenir AI Champion</h2><p class="desc">${V.missionsChampion.map(m => m[1].toLowerCase()).join(", ")} : une heure par semaine, avec l'appui de l'AI Officer de votre pôle.</p></div>
        <button class="btn contour" data-act="toast" data-msg="Candidature envoyée : l'AI Officer de votre pôle vous recontacte (démonstration).">Je me porte candidat</button></div>`}`;
  };

  // ---------- La colonne de Repère ----------
  // Le menu suit le plan de la page « Le Hub IA, c'est quoi ? » : trois usages (utiliser, se former, suivre),
  // et dans chacun ce qui est pour tous, puis ce qui vient du métier et du rôle. Même ossature pour chacun, filtrée.
  const lienRail = r => ([cle, i, n, x]) => `<a href="#${cle}" class="${r === cle ? "actif" : ""}">${ic(i)}<span>${n}</span>${x ? `<span class="compteur">${x}</span>` : ""}</a>`;
  const rail = r => {
    const c = moi(), m = metier(), l = lienRail(r), officer = c.role === "officer", champion = c.role === "champion";
    const voit = x => x && !masque(x[0]);
    const groupe = (t, xs) => { const v = xs.filter(voit); return v.length ? `<div class="groupe">${t}</div>` + v.map(l).join("") : ""; };
    const metiers = officer ? D.metiers : m ? [m] : [];
    return `<div class="haut-rail">${ouvrir("", "", "btn sia-btn", "Ouvrir Sécur'IA")}</div>`
      + l(["", "home", "Accueil"]) + l(["favoris", "star", "Mes favoris", favoris().length])
      + groupe("Utiliser l'IA", [["outils", "apps", "Les outils"], ["agents", "smart_toy", "Les agents"],
        ...metiers.map(x => [`metier/${x.id}`, x.icone, metiers.length > 1 ? x.court : `L'IA ${x.de}`]),
        (m && m.id === "it") || officer ? ["services", "cable", "Services et MCP"] : null,
        pourQui(CONSTRUIT) ? ["construire", "construction", "Construire un agent"] : null,
        officer ? ["registre", "inventory", "Registre des agents"] : null])
      + groupe("Se former", [["apprendre", "school", "Apprendre"], ["regles", "rule", pourQui(ACTEURS) ? "Cadre et règles" : "Les règles"], ["prompts", "edit_note", "Les prompts"],
        ["champions", "diversity_3", "Les AI Champions"], champion ? ["champion", "military_tech", "Espace Champions"] : null])
      + groupe("Suivre et progresser", [["actualites", "newspaper", "Actualités"], ["evenements", "calendar_month", "Événements"],
        officer ? ["chiffres", "bar_chart", "Tableau de bord"] : D.mesChiffres[c.id] ? ["chiffres", "bar_chart", "Mes chiffres"] : null,
        officer ? ["tableau", "monitoring", "Suivi des agents"] : null, pourQui(ACTEURS) ? ["modele", "account_tree", "Modèle opérationnel"] : null, ["avis", "rate_review", "Donner mon avis"]])
      + `<div class="rail-bas">${l(["hub", "info", "Le Hub IA, c'est quoi ?"])}</div>`;
  };

  // ---------- Rendu ----------
  const $ = s => document.querySelector(s);
  const route = () => decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  function rendre(garder) {
    const r = route(), c = moi(), dansSia = r === "sia" || r.startsWith("sia/");
    document.body.classList.toggle("dans-sia", dansSia);
    if (dansSia) { $("#sia").innerHTML = sia(r.split("/")[1]); const i = $("#sia .sia-saisie input"); if (i) i.focus(); animer(); return; }
    etat.retour = r;
    $("#rail").innerHTML = rail(r.startsWith("tableau/") ? "tableau" : r.startsWith("agent/") ? "agents" : r.startsWith("article/") ? "actualites" : r.startsWith("evenement/") ? "evenements" : r.startsWith("cadre/") ? "regles" : r.startsWith("modele/") ? "modele" : r);
    $("#compte").innerHTML = `${avatar(c.nom, c.teinte)}<span class="qui"><b>${esc(c.prenom)}</b><span>${esc(c.poste)}</span></span>${ic("expand_more", "s20")}`;
    const pan = $("#panneau"), y = pan.scrollTop;
    const [base, sous] = r.split("/");
    const contenu = base === "metier" ? pageMetier(sous) : base === "agent" ? pageAgent(sous) : base === "article" ? pageArticle(sous) : base === "evenement" ? pageEvenement(sous) : base === "tableau" && sous ? pageTableau(sous) : (P[r] || introuvable)();
    const bas = r === "avis" ? "" : `<div class="avis-bas"><span>Cette page vous aide ?</span><button class="pouce" data-act="pouce" aria-label="Oui">${ic("thumb_up", "s20")}</button><button class="pouce" data-act="avis" aria-label="Non">${ic("thumb_down", "s20")}</button></div>`;
    pan.innerHTML = `<main class="page" id="page">${contenu}${bas}</main><footer class="pied"><span>Prototype Repère v12 · agents, outils, personnes et chiffres illustratifs · situation au ${D.situation}</span><span style="margin-left:auto">Le Hub IA de LCL</span></footer>`;
    if (garder) { pan.querySelector(".page").style.animation = "none"; pan.scrollTop = y; } else pan.scrollTop = 0;
    if (etat.ciblePrompt) { const x = pan.querySelector(`[data-id="${etat.ciblePrompt}"]`); etat.ciblePrompt = null; if (x) { const c = x.closest(".carte"); c.scrollIntoView({ block: "center" }); c.classList.add("eclaire"); } }
  }
  // Le filtre des favoris ne vaut que pour le lien qui l'a choisi ; « Mes favoris » dans la colonne les montre tous.
  window.addEventListener("hashchange", () => { if (!etat.garderF) etat.filtres.favoris = "tous"; etat.garderF = false; rendre(false); });
  // Aller dans Sécur'IA : la question part avec l'agent ; sans agent, c'est le chat de Sécur'IA qui la reçoit.
  function versSia(id, q, connue, titre) {
    if (q && !id) id = "securi-chat";
    etat.envoi = q ? { id, q, connue, titre } : null;
    const h = "#sia" + (id ? "/" + id : "");
    if (location.hash === h) rendre(); else location.hash = h;
  }

  // ---------- Toasts et menu des comptes ----------
  let minuterie;
  function toast(m, icone = "check_circle") {
    document.querySelectorAll(".toast").forEach(t => t.remove());
    const t = document.createElement("div"); t.className = "toast"; t.innerHTML = ic(icone) + esc(m); document.body.appendChild(t);
    clearTimeout(minuterie); minuterie = setTimeout(() => t.remove(), 3200);
  }
  function menuComptes(ancre) {
    document.querySelectorAll(".menu").forEach(x => x.remove());
    const r = ancre.getBoundingClientRect(), m = document.createElement("div");
    m.className = "menu"; m.style.top = (r.bottom + 8) + "px"; m.style.right = (window.innerWidth - r.right) + "px";
    m.innerHTML = `<div class="titre">Changer de compte (démonstration)</div>` + D.comptes.map(c => `<button class="item ${c.id === etat.compte ? "actif" : ""}" data-act="choisir-compte" data-id="${c.id}">${avatar(c.nom, c.teinte)}<div><b>${esc(c.nom)}</b><span>${esc(c.poste)} · ${esc(c.entite)}</span></div></button>`).join("");
    document.body.appendChild(m);
    setTimeout(() => document.addEventListener("click", function f(e) { if (!m.contains(e.target)) { m.remove(); document.removeEventListener("click", f); } }), 0);
  }

  // ---------- Les actions ----------
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act, id = b.dataset.id;
    if (act === "sia") { e.preventDefault(); versSia(id, b.dataset.q, true); }
    else if (act === "plan-voir") voirPlan(b.dataset.val);
    else if (act === "cherche") { etat.qA = b.dataset.q; const i = document.getElementById("cherche-accueil"); if (i) { i.value = etat.qA; i.focus(); } document.getElementById("resultats").innerHTML = resultats(etat.qA); }
    else if (ACTIONS[act]) ACTIONS[act](b, e);
    else if (act === "chap-hub") { etat.chapHub = +b.dataset.val; rendre(); }
    else if (act === "sia-pj") { etat.pj[id] = !etat.pj[id]; rendre(); }
    else if (act === "sia-nouveau") { etat.fils[id] = []; etat.pj[id] = false; rendre(); }
    else if (act === "sia-anonymiser") { const i = $("#sia .sia-saisie input"); i.value = anonymiser(b.dataset.q); i.focus(); }
    else if (act === "sia-copier") { const z = b.closest(".sia-copiable") || b.closest(".sia-msg"), t = (z.querySelector("pre, blockquote, .sia-texte") || z).innerText;
      try { navigator.clipboard.writeText(t); } catch (x) { } toast("Copié. Relisez avant de vous en servir."); }
    else if (act === "sia-note") { b.parentElement.querySelectorAll("[data-act=sia-note]").forEach(x => x.classList.toggle("on", x === b));
      toast(b.dataset.val === "1" ? "Merci : votre retour va à l'équipe qui fait vivre cet agent." : "Merci : l'équipe de l'agent relira cette réponse.", b.dataset.val === "1" ? "thumb_up" : "thumb_down"); }
    else if (act === "theme") {
      const t = b.dataset.val; document.documentElement.dataset.theme = t; try { localStorage.setItem("repere12-theme", t); } catch (x) { } majTheme();
    }
    else if (act === "compte") { e.stopPropagation(); menuComptes(b); }
    else if (act === "choisir-compte") { etat.compte = id; sauver(); document.querySelectorAll(".menu").forEach(x => x.remove()); location.hash = ""; rendre(); toast("Vous êtes " + moi().nom + ".", "person"); }
    else if (act === "inscrire") { const i = etat.inscrit.indexOf(id); if (i >= 0) etat.inscrit.splice(i, 1); else etat.inscrit.push(id); sauver(); rendre(true); toast(i < 0 ? "Inscription confirmée : l'invitation part dans votre agenda." : "Inscription annulée.", "event"); }
    else if (act === "favori") { const f = favoris().slice(), i = f.indexOf(id); if (i >= 0) f.splice(i, 1); else f.push(id); etat.favoris[etat.compte] = f; sauver(); rendre(true); toast(i < 0 ? "Ajouté à vos favoris." : "Retiré de vos favoris.", "star"); }
    else if (act === "filtre") { etat.filtre = b.dataset.val; rendre(true); }
    else if (act === "filtre-e" || act === "filtre-p" || act === "filtre-a") { etat.filtres[{ "filtre-e": "evenements", "filtre-p": "prompts", "filtre-a": "articles" }[act]] = b.dataset.val; rendre(true); }
    else if (act === "filtre-fav") { etat.filtres.favoris = b.dataset.val; etat.garderF = true; if (route() === "favoris") { e.preventDefault(); etat.garderF = false; rendre(true); } }
    else if (act === "filtre-t") { etat.filtres.tableau = b.dataset.val; rendre(true); }
    else if (act === "toutes-p") { etat.toutesP = !etat.toutesP; rendre(true); }
    else if (act === "voir-prompt") { etat.ciblePrompt = id; etat.q = ""; const p = prompt(id); etat.filtres.prompts = p.theme; if (!pourMoiP(p)) etat.toutesP = true; }
    else if (act === "copier") { e.preventDefault(); const p = prompt(id); try { navigator.clipboard && navigator.clipboard.writeText(p.texte).catch(() => { }); } catch (x) { } toast("Prompt copié : collez-le dans Sécur'IA, sans nom ni numéro de compte client.", "content_copy"); }
    else if (act === "prompt-sia") { const p = prompt(id); versSia("securi-chat", p.texte, false, p.titre); }
    else if (act === "filtreR") { etat.filtreR = b.dataset.val; rendre(true); }
    else if (act === "avis") { e.preventDefault(); panneauAvis(); }
    else if (act === "pouce") { b.classList.add("on"); toast("Merci.", "thumb_up"); }
    else if (act === "avis-fermer") { document.querySelectorAll(".avis-voile").forEach(x => x.remove()); }
    else if (act === "toast") { e.preventDefault(); toast(b.dataset.msg, b.dataset.ic); }
  });
  // La recherche dans les prompts : le filtre s'applique à chaque lettre, le curseur reste dans le champ.
  document.addEventListener("input", e => {
    if (e.target.matches("[data-cherche]")) { etat.qA = e.target.value; const r = document.getElementById("resultats"); if (r) r.innerHTML = resultats(etat.qA); return; }
    const i = e.target.closest("[data-recherche]"); if (!i) return;
    etat.q = i.value; rendre(true);
    const n = document.querySelector("[data-recherche]"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
  });
  document.addEventListener("submit", e => {
    if (e.target.matches("[data-form=cherche]")) { e.preventDefault(); const a = document.querySelector("#resultats .resultats a, #resultats .resultats button"); if (a) a.click(); return; }
    const fa = e.target.closest("[data-form=avis]");
    if (fa) {
      e.preventDefault();
      const a = { page: fa.page.value, texte: fa.texte.value.trim(), date: new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long" }) };
      etat.avis[etat.compte] = mesAvis().concat([a]); sauver();
      document.querySelectorAll(".avis-voile").forEach(x => x.remove()); rendre(true);
      toast("Merci, c'est envoyé.", "rate_review");
      return;
    }
    const f = e.target.closest("[data-form=sia]"); if (!f) return;
    e.preventDefault(); const q = f.q.value.trim(); if (q) versSia(f.dataset.id, q);
  });
  // L'infobulle des graphiques : au survol ou au clavier, la valeur et sa semaine.
  const bulle = document.createElement("div"); bulle.className = "infobulle"; bulle.setAttribute("role", "tooltip");
  const montrer = el => { const r = el.getBoundingClientRect(); bulle.textContent = el.dataset.tip; document.body.appendChild(bulle); const b = bulle.getBoundingClientRect();
    bulle.style.left = Math.min(innerWidth - b.width - 8, Math.max(8, r.left + r.width / 2 - b.width / 2)) + "px"; bulle.style.top = (r.top + (el.querySelector("path") ? el.querySelector("path").getBoundingClientRect().top - r.top : 0) - b.height - 8) + "px"; };
  document.addEventListener("mouseover", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el) montrer(el); else bulle.remove(); });
  document.addEventListener("focusin", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el) montrer(el); else bulle.remove(); });
  window.addEventListener("hashchange", () => bulle.remove());
  document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".avis-voile").forEach(x => x.remove()); });
  // Le bouton du thème montre ce qu'on obtient en cliquant.
  function majTheme() {
    const th = document.documentElement.dataset.theme;
    document.querySelectorAll("[data-act=theme]").forEach(b => { b.classList.toggle("on", b.dataset.val === th); b.setAttribute("aria-pressed", b.dataset.val === th); });
  }

  document.addEventListener("DOMContentLoaded", () => { majTheme(); rendre(); });
})();

</script>
<style>#demo-bandeau{position:fixed;bottom:12px;right:12px;z-index:99999;font:12px/1.4 system-ui,sans-serif;background:rgba(0,0,0,.65);color:#fff;padding:6px 10px;border-radius:6px}#demo-bandeau a{color:#ffd204;text-decoration:none;margin-left:8px}#demo-bandeau a:hover{text-decoration:underline}body.dans-sia #demo-bandeau{display:none}</style><div id="demo-bandeau">Prototype de démonstration · contenu fictif<a href="teaser/">▶ Voir le teaser</a></div></body>
</html>
